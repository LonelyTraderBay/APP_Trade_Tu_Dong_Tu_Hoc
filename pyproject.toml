[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotrade"
version = "0.1.0a0"
description = "AutoTrade AI Desktop Solo — D1b CCXT DEMO + D1a Paper core"
readme = "AGENTS.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "keyring>=25,<26",
  "python-telegram-bot>=21,<23",
  "argon2-cffi>=25.1.0",
  "ccxt>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
autotrade-headless = "autotrade.entrypoints.headless:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autotrade"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "d1a: D1a exit / fault / integration suites",
  "d1b: D1b DEMO allowlist / contract / fault / evidence suites",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
